<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit Summative: Mind, Media &amp; Nutrition</title>
<link rel="preconnect" href=https://fonts.googleapis.com>
<link rel="preconnect" href=https://fonts.gstatic.com crossorigin>
<link href=https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&display=swap rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#F2F7F5; --surface:#FFFFFF; --ink:#16262E; --muted:#4B5F67; --line:#CBDAD4;
  --accent:#17624F; --accent-ink:#FFFFFF; --accent-soft:#DDF0E8;
  --warn:#B53A17; --warn-ink:#FFFFFF; --warn-soft:#FBE6DE;
  --sun:#F2B93B; --focus:#0B57D0;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1A1F; --surface:#172830; --ink:#E7EFF1; --muted:#9DB0B7; --line:#2B4048;
    --accent:#5CC9A7; --accent-ink:#0A1F19; --accent-soft:#17352E;
    --warn:#FF9070; --warn-ink:#2B0F06; --warn-soft:#3A2019;
    --sun:#F2B93B; --focus:#FFD166;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1A1F; --surface:#172830; --ink:#E7EFF1; --muted:#9DB0B7; --line:#2B4048;
  --accent:#5CC9A7; --accent-ink:#0A1F19; --accent-soft:#17352E;
  --warn:#FF9070; --warn-ink:#2B0F06; --warn-soft:#3A2019;
  --sun:#F2B93B; --focus:#FFD166;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.015em;line-height:1.12}
h1{font-size:clamp(2.1rem,7vw,3.2rem);font-weight:700;letter-spacing:-.03em}
h2{font-size:1.65rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:.6em 0}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
main{padding-top:22px;padding-bottom:48px;outline:none}
.meta{color:var(--muted);margin:.35em 0 1.1em}
.lede{font-size:1.15rem;max-width:34em}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--head);font-weight:700;font-size:1rem;margin-right:auto}
#steps{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:inherit;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:3px 11px 3px 4px;border-radius:999px;cursor:pointer}
.pill .pn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-weight:700;font-size:.85rem}
.pill[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.pill[aria-current="step"] .pn{background:var(--accent);color:var(--accent-ink)}
.pill .tick{color:var(--accent);font-weight:700}
.timer{font:inherit;font-family:var(--mono);font-size:.88rem;background:transparent;border:2px solid var(--line);border-radius:8px;padding:3px 10px;color:var(--ink);cursor:pointer}
.timer.low{border-color:var(--warn);color:var(--warn)}

/* controls */
.btn{font:inherit;font-weight:700;border-radius:8px;padding:.7em 1.3em;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:.4em .9em;font-size:.95rem}
.btn.on{background:var(--accent-soft);color:var(--accent)}
.btn.danger{border-color:var(--warn);background:var(--warn);color:var(--warn-ink)}
.linkbtn{font:inherit;font-size:.9rem;color:var(--muted);background:none;border:none;text-decoration:underline;cursor:pointer;padding:6px 0}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,.opt:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;flex-wrap:wrap}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.sec{margin-top:34px}
.sec>h3{margin-bottom:4px}

/* intro */
.plan{list-style:none;padding:0;margin:22px 0;display:grid;gap:8px}
.plan li{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.plan .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.plan .t{color:var(--muted);font-size:.92rem;text-align:right}
label.f{display:block;font-weight:700;margin:12px 0 4px}
.in{width:100%;font:inherit;padding:.6em .75em;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.err{color:var(--warn);font-weight:700;margin:6px 0 0}

/* claims */
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.post-head{display:flex;align-items:center;gap:10px;font-weight:700}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.av0{background:#7A4EAB}.av1{background:#C2410C}.av2{background:#1D6F8A}.av3{background:#8A6A00}.av4{background:#B0305C}.av5{background:#3F6F2B}
.post p{margin:.6em 0 .9em}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg-btn{font:inherit;font-weight:700;padding:.45em 1em;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg-btn[aria-pressed="true"][data-v="ok"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg-btn[aria-pressed="true"][data-v="flag"]{background:var(--warn);border-color:var(--warn);color:var(--warn-ink)}

/* multiple choice */
fieldset.mc{border:none;padding:0;margin:20px 0}
fieldset.mc legend{font-weight:700;padding:0;margin-bottom:6px}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:11px 14px;margin:8px 0;cursor:pointer;background:var(--surface)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:.3em;accent-color:var(--accent);width:1.1em;height:1.1em;flex:none}

/* cart */
.aisle{margin-top:22px}
.aisle h3{margin-bottom:8px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:6px 0}
.item.in{border-color:var(--accent);background:var(--accent-soft)}
.item .nm{font-weight:700;display:block}
.item .sub{color:var(--muted);font-size:.9rem}
.price{font-family:var(--mono);font-size:.95rem}
.cartbar{position:sticky;bottom:0;z-index:5;background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));margin-top:18px}
.cartbar.over{border-color:var(--warn)}
.cartbar .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700}
.cartbar .row .money{font-family:var(--mono)}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.meter>i{display:block;height:100%;background:var(--accent);width:var(--w)}
.over .meter>i{background:var(--warn)}
.cartbar .note{font-size:.92rem;color:var(--muted);margin:0}
.over .note{color:var(--warn);font-weight:700}
.receipt{font-family:var(--mono);font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px 20px;margin-top:24px;max-width:420px}
.receipt h3{font-family:var(--mono);font-size:1rem;font-weight:500;text-align:center;letter-spacing:0}
.rule{border-top:2px dashed var(--line);margin:10px 0}
.rl{display:flex;justify-content:space-between;gap:12px}
.rl.total{font-weight:500;font-size:1rem}
.empty{color:var(--muted);text-align:center;margin:8px 0}

/* scenario */
.jordan{border-left:6px solid var(--sun)}
.scene{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.decision{margin-top:30px}
.choices{display:grid;gap:8px;margin-top:10px}
.choice{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.choice:disabled{cursor:default;opacity:.55}
.choice.chosen{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.story{border-left:5px solid var(--sun);background:var(--surface);padding:10px 16px;border-radius:0 10px 10px 0;margin:12px 0}
.story p{margin:.3em 0 0}

/* writing */
.ta{width:100%;min-height:210px;font:inherit;line-height:1.55;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical}
.wc{color:var(--muted);font-size:.9rem;margin:4px 0 0;text-align:right}
.checks{display:grid;gap:6px;margin:10px 0 14px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.checks input{margin-top:.3em;accent-color:var(--accent)}

/* confirm + done */
.confirm{border:2px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:14px 18px;margin-top:24px}
.confirm ul{margin:.4em 0 .8em;padding-left:1.2em}
.confirm .nav{margin-top:12px}
.score{display:grid;gap:8px;margin:16px 0}
.score div{display:flex;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.score b{font-family:var(--mono);font-weight:500}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.msg{min-height:1.5em;font-weight:700;color:var(--accent)}
details{margin-top:14px}
pre.report{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:.82rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:10px}

@media (max-width:520px){
  .plan li{grid-template-columns:34px 1fr}
  .plan .t{grid-column:2;text-align:left}
  .item{grid-template-columns:1fr auto}
  .item .btn{grid-column:1 / -1}
  .pill .pl{display:none}
  .pill{padding-right:5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand">Mind, Media &amp; Nutrition</div>
    <nav id="steps" aria-label="Parts of the summative"></nav>
    <button class="timer" id="timer" data-act="timer" hidden></button>
  </div>
</header>
<main class="wrap" id="main" tabindex="-1"></main>
<script src=https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js></script>
<noscript><p class="wrap">This summative needs JavaScript. Please turn it on and reload.</p></noscript>

<script>
/* ---------- content ---------- */
var PARTS=[
  {n:1,label:'Claims',title:'Claims and quick check',min:8,pts:10},
  {n:2,label:'Cart',title:'Jordan’s grocery cart',min:6,pts:10},
  {n:3,label:'Jordan',title:'Jordan’s week',min:6,pts:8},
  {n:4,label:'Writing',title:'Show what you know',min:20,pts:22}
];
var TOTAL_SECONDS=40*60;

var CLAIMS=[
  {id:'c1',handle:'@glow.with.gia',text:'“Detox your whole body in 3 days with my tea. Doctors hate this one trick!”',answer:'flag'},
  {id:'c2',handle:'@dietitian.dana',text:'Registered dietitian: “A review of 20 studies links higher-fiber diets to more diverse gut bacteria. Study linked below. Results vary from person to person.”',answer:'ok'},
  {id:'c3',handle:'@fit.felix',text:'“Cut out carbs forever and you’ll glow. Don’t take my word for it, 40k followers agree! Use code FELIX20 for my powder.”',answer:'flag'},
  {id:'c4',handle:'@nutrition.prof',text:'University nutrition researcher: “Fermented foods like yogurt with live cultures may support gut bacteria, but they aren’t a cure-all. Here’s the source.”',answer:'ok'},
  {id:'c5',handle:'@juicy.jules',text:'“This one superfood fixes your gut, your mood, and your skin in 7 days. I’m not a doctor, but I know what works.”',answer:'flag'},
  {id:'c6',handle:'@mealprep.mia',text:'“Frozen and canned veggies with no added salt or sugar are nutritious and budget-friendly, according to USDA MyPlate guidance (link in my bio).”',answer:'ok'}
];

var MC=[
  {id:'q1',q:'Which statement best describes the difference between IQ and EQ?',correct:'a',opts:[
    {id:'a',t:'IQ reflects reasoning and problem-solving. EQ is about recognizing and managing emotions in yourself and others.'},
    {id:'b',t:'IQ is about kindness, and EQ is about intelligence.'},
    {id:'c',t:'EQ is fixed at birth, while IQ can be developed.'},
    {id:'d',t:'They measure the same thing in different ways.'}]},
  {id:'q2',q:'In The Social Dilemma, why are social media platforms designed to keep you scrolling?',correct:'b',opts:[
    {id:'a',t:'To help users learn faster.'},
    {id:'b',t:'Your attention is what advertisers pay for, so more time on the app means more revenue.'},
    {id:'c',t:'To protect user privacy.'},
    {id:'d',t:'To encourage people to spend less time on screens.'}]},
  {id:'q3',q:'Which is the best example of vulnerability as a strength?',correct:'c',opts:[
    {id:'a',t:'Hiding your feelings so no one can use them against you.'},
    {id:'b',t:'Agreeing with everyone to avoid conflict.'},
    {id:'c',t:'Telling a friend you’re struggling and asking for support.'},
    {id:'d',t:'Posting only your best moments online.'}]},
  {id:'q4',q:'Which habit is best supported for a healthy gut microbiome?',correct:'d',opts:[
    {id:'a',t:'Cutting out all carbohydrates.'},
    {id:'b',t:'Taking any probiotic supplement every day.'},
    {id:'c',t:'Eating the same few foods every day.'},
    {id:'d',t:'Eating a variety of fiber-rich plant foods.'}]}
];

var AISLES=[
  {id:'produce',name:'Produce and frozen'},
  {id:'grains',name:'Grains and bread'},
  {id:'protein',name:'Beans, eggs, and meat'},
  {id:'dairy',name:'Dairy'},
  {id:'wellness',name:'Wellness and snacks'}
];
/* group = food group credit; gut = fiber-rich or fermented; hype = marketing-driven product */
var ITEMS=[
  {id:'banana',aisle:'produce',name:'Bananas',desc:'1 bunch',price:1.50,group:'fruitveg',gut:true},
  {id:'frozenveg',aisle:'produce',name:'Frozen mixed vegetables',desc:'16 oz bag, no sauce',price:2.00,group:'fruitveg',gut:true},
  {id:'spinach',aisle:'produce',name:'Fresh baby spinach',desc:'5 oz container',price:3.50,group:'fruitveg'},
  {id:'apples',aisle:'produce',name:'Apples',desc:'3 lb bag',price:4.50,group:'fruitveg',gut:true},
  {id:'carrots',aisle:'produce',name:'Carrots',desc:'2 lb bag',price:2.00,group:'fruitveg',gut:true},
  {id:'oats',aisle:'grains',name:'Rolled oats',desc:'42 oz canister',price:4.00,group:'grain',gut:true},
  {id:'wwbread',aisle:'grains',name:'Whole wheat bread',desc:'1 loaf',price:3.00,group:'grain',gut:true},
  {id:'brownrice',aisle:'grains',name:'Brown rice',desc:'2 lb bag',price:3.00,group:'grain',gut:true},
  {id:'cereal',aisle:'grains',name:'Frosted cereal',desc:'Family size, sugary',price:5.00},
  {id:'noodles',aisle:'grains',name:'Instant noodle cups',desc:'6 pack',price:3.00},
  {id:'blackbeans',aisle:'protein',name:'Dry black beans',desc:'1 lb bag',price:1.80,group:'protein',gut:true},
  {id:'chickpeas',aisle:'protein',name:'Canned chickpeas',desc:'15 oz, no salt added',price:1.20,group:'protein',gut:true},
  {id:'eggs',aisle:'protein',name:'Eggs',desc:'1 dozen',price:3.50,group:'protein'},
  {id:'chicken',aisle:'protein',name:'Chicken thighs',desc:'2 lb pack',price:5.00,group:'protein'},
  {id:'pb',aisle:'protein',name:'Natural peanut butter',desc:'16 oz jar',price:3.50,group:'protein'},
  {id:'yogurt',aisle:'dairy',name:'Plain yogurt, live cultures',desc:'32 oz tub',price:3.50,group:'dairy',gut:true},
  {id:'milk',aisle:'dairy',name:'Milk',desc:'Half gallon',price:2.50,group:'dairy'},
  {id:'tea',aisle:'wellness',name:'“Detox” tea',desc:'20 bags, “flushes toxins fast”',price:12.00,hype:true},
  {id:'bars',aisle:'wellness',name:'Protein bars',desc:'6 count, “clean energy”',price:9.00,hype:true},
  {id:'energy',aisle:'wellness',name:'Energy drinks',desc:'4 pack',price:7.00,hype:true},
  {id:'powder',aisle:'wellness',name:'Gut Reset Powder',desc:'Influencer’s link, 30 servings',price:60.00,hype:true}
];
var BUDGET=25;

var DEC=[
  {id:'d1',prompt:'Jordan sees this post and feels tempted. What does Jordan do first?',
   scene:'<div class="scene"><strong>@fit.felix</strong><p>Day 14 of my gut reset! Detox your body, boost your mood, lose weight FAST. $60 powder, link in my bio. Everyone should cut out whole food groups, trust me.</p></div>',
   options:[
    {id:'a',pts:2,text:'Look up who makes the powder, whether the claims cite real research, and whether the influencer has nutrition credentials.',after:'Jordan finds out the influencer sells the powder, has no nutrition training, and the “research” link goes to the company’s own page. The pressure to buy fades.'},
    {id:'b',pts:1,text:'Scroll the comments to see if people say it worked.',after:'Plenty of comments say “obsessed!!” but several come from accounts that also promote the brand. Jordan can’t tell what’s real.'},
    {id:'c',pts:0,text:'Order it. $60 is a lot, but everyone seems to be doing it.',after:'The powder costs more than two weeks of Jordan’s food money, and now there’s less left for groceries.'}]},
  {id:'d2',prompt:'It’s 11:30 pm. Jordan has been scrolling for over an hour, feels anxious, and keeps comparing their life to everyone else’s highlights. What does Jordan do?',
   options:[
    {id:'a',pts:2,text:'Mute the accounts that trigger comparison, turn off notifications, and charge the phone outside the bedroom.',after:'Jordan’s feed feels calmer the next day, and falling asleep gets easier.'},
    {id:'b',pts:1,text:'Delete every app tonight and never go back.',after:'Jordan feels relief for a day, then feels cut off from friends’ plans and reinstalls everything by the weekend.'},
    {id:'c',pts:0,text:'Keep scrolling. The anxious feeling will probably pass if Jordan finds something funny.',after:'The feed keeps serving more of the same. Jordan falls asleep after 1 am and wakes up tired and more on edge.'}]},
  {id:'d3',prompt:'The group chat posts a photo from a hangout Jordan wasn’t invited to. Jordan feels a sharp pang. What does Jordan do first?',
   options:[
    {id:'a',pts:2,text:'Pause, name the feeling (“I feel left out”), and ask a friend about it later instead of assuming.',after:'Jordan learns the hangout was last-minute and no one meant to leave anyone out. Naming the feeling made it easier to handle.'},
    {id:'b',pts:1,text:'Ignore the feeling and act like it doesn’t matter.',after:'The feeling fades a little but comes back at night, and Jordan still doesn’t know what happened.'},
    {id:'c',pts:0,text:'Reply with a sarcastic comment under the photo.',after:'The comment makes the group chat awkward. Now Jordan has an argument to deal with on top of the original feeling.'}]},
  {id:'d4',prompt:'At lunch, Maya says, “You okay? You’ve seemed off lately.” Jordan has been hiding the stress and anxiety. What does Jordan say?',
   options:[
    {id:'a',pts:2,text:'Tell Maya the truth: stressed about fitting in, anxious after scrolling, and tempted by the powder. Ask what helps her.',after:'Maya admits her feed makes her feel the same way. They agree to check in with each other, and Jordan feels lighter.'},
    {id:'b',pts:1,text:'Say “just tired” and see how Maya reacts.',after:'Maya says, “Okay, tell me if you want to talk.” The door is open, but Jordan is still carrying it alone.'},
    {id:'c',pts:0,text:'Say “I’m fine” and change the subject.',after:'Maya drops it. Jordan walks away feeling a little more alone.'}]}
];

var WB=[
  {key:'iqeq',title:'IQ, EQ, and vulnerability',prompt:'A person with a high IQ can still struggle in relationships or at work. Explain why, and how EQ and vulnerability could help. Use at least one specific example.'},
  {key:'gut',title:'Gut health',prompt:'Using the gut health documentary and our lessons, explain how food choices can affect gut health and overall well-being. Include at least two specific foods or habits and explain why they matter.'},
  {key:'social',title:'Social media and technology',prompt:'Using at least two ideas from The Social Dilemma or our class discussions, explain how social media design affects behavior and mental health. Then describe one realistic change a teen could make to use technology in a healthier way.'}
];

/* ---------- state ---------- */
var KEY='hs-summative-mind-media-nutrition-v1';
function fresh(){return {v:1,seed:Math.floor(Math.random()*1e9)+1,part:0,startTs:null,name:'',period:'',claims:{},mc:{},cart:[],dec:{},checks:{a:false,b:false,c:false},wA:'',wBkey:'',wB:'',hideTimer:false,confirming:false,submitted:false,submittedTs:null}}
function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
var state=load()||fresh();
var saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}},200)}

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return '$'+n.toFixed(2)}
function wc(s){s=s.trim();return s?s.split(/\s+/).length:0}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,key){var r=mulberry(hashStr(key+state.seed));var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function itemById(id){for(var i=0;i<ITEMS.length;i++)if(ITEMS[i].id===id)return ITEMS[i];return null}
function count(o){return Object.keys(o).length}

/* ---------- scoring ---------- */
function scoreP1(){
  var c=0,q=0;
  CLAIMS.forEach(function(x){if(state.claims[x.id]===x.answer)c++});
  MC.forEach(function(x){if(state.mc[x.id]===x.correct)q++});
  return {claims:c,mc:q,total:c+q};
}
function cartStats(){
  var items=state.cart.map(itemById).filter(Boolean);
  var total=Math.round(items.reduce(function(s,i){return s+i.price*100},0))/100;
  var g={};items.forEach(function(i){if(i.group)g[i.group]=1});
  return {items:items,total:total,groups:count(g),gut:items.filter(function(i){return i.gut}).length,hype:items.filter(function(i){return i.hype}).length};
}
function scoreP2(){
  var s=cartStats(),enough=s.items.length>=6;
  var budget=(enough&&s.total<=BUDGET)?3:0;
  var grp=s.groups>=3?3:(s.groups===2?1:0);
  var gut=s.gut>=3?2:(s.gut===2?1:0);
  var hy=enough?(s.hype===0?2:(s.hype===1?1:0)):0;
  return {budget:budget,groups:grp,gut:gut,hype:hy,total:budget+grp+gut+hy,stats:s};
}
function scoreP3(){
  var t=0;
  DEC.forEach(function(d){var o=d.options.filter(function(x){return x.id===state.dec[d.id]})[0];if(o)t+=o.pts});
  return t;
}
function partDone(n){
  if(n===1)return count(state.claims)===CLAIMS.length&&count(state.mc)===MC.length;
  if(n===2)return state.cart.length>0;
  if(n===3)return count(state.dec)===DEC.length;
  if(n===4)return state.wA.trim().length>0&&!!state.wBkey&&state.wB.trim().length>0;
  return false;
}
function missing(){
  var m=[];
  var c=CLAIMS.filter(function(x){return !state.claims[x.id]}).length+MC.filter(function(x){return !state.mc[x.id]}).length;
  if(c)m.push('Part 1: '+c+' unanswered');
  if(!state.cart.length)m.push('Part 2: your cart is empty');
  var d=DEC.filter(function(x){return !state.dec[x.id]}).length;
  if(d)m.push('Part 3: '+d+(d>1?' decisions':' decision')+' left');
  if(!state.wA.trim())m.push('Part 4: the letter to Jordan is blank');
  if(!state.wBkey||!state.wB.trim())m.push('Part 4: your second response is blank');
  return m;
}

/* ---------- header + timer ---------- */
function renderHeader(){
  var steps=$('#steps'),tm=$('#timer');
  if(state.part===0||state.part===5){steps.innerHTML='';tm.hidden=true;return}
  steps.innerHTML=PARTS.map(function(p){
    var act=state.part===p.n;
    return '<button class="pill" data-k="pill'+p.n+'" data-act="goto" data-n="'+p.n+'" aria-current="'+(act?'step':'false')+'" aria-label="Part '+p.n+': '+p.title+(partDone(p.n)?' (complete)':'')+'"><span class="pn">'+p.n+'</span><span class="pl">'+p.label+'</span>'+(partDone(p.n)?'<span class="tick" aria-hidden="true">✓</span>':'')+'</button>';
  }).join('');
  tm.hidden=false;
  tickTimer();
}
function tickTimer(){
  var tm=$('#timer');
  if(tm.hidden||!state.startTs)return;
  if(state.hideTimer){tm.textContent='Show timer';tm.classList.remove('low');tm.setAttribute('aria-label','Show timer');return}
  var left=TOTAL_SECONDS-Math.floor((Date.now()-state.startTs)/1000);
  var txt;
  if(left<=0){txt='Time’s up. Wrap up.';tm.classList.add('low')}
  else{var m=Math.floor(left/60),s=left%60;txt=m+':'+(s<10?'0':'')+s+' left';tm.classList.toggle('low',left<=300)}
  tm.textContent=txt;tm.setAttribute('aria-label','Time remaining: '+txt+'. Press to hide the timer.');
}
setInterval(tickTimer,1000);

/* ---------- views ---------- */

function part1(){
  var posts=shuf(CLAIMS,'claims').map(function(c,i){
    var v=state.claims[c.id];

    '<div class="seg" role="group" aria-label="Your judgment of the post by '+c.handle+'">'+
    '<button class="seg-btn" data-k="cl-'+c.id+'-ok" data-act="claim" data-id="'+c.id+'" data-v="ok" aria-pressed="'+(v==='ok')+'">Trustworthy</button>'+
    '<button class="seg-btn" data-k="cl-'+c.id+'-flag" data-act="claim" data-id="'+c.id+'" data-v="flag" aria-pressed="'+(v==='flag')+'">Red flag</button></div></article>';
  }).join('');
  var qs=MC.map(function(q,qi){
    return '<fieldset class="mc"><legend>'+(qi+1)+'. '+q.q+'</legend>'+shuf(q.opts,'mc'+q.id).map(function(o){

      return '<label class="opt'+(sel?' sel':'')+'"><input type="radio" name="'+q.id+'" value="'+o.id+'" data-k="mc-'+q.id+'-'+o.id+'" data-act="mc" data-q="'+q.id+'"'+(sel?' checked':'')+'><span>'+o.t+'</span></label>';
    }).join('')+'</fieldset>';
  }).join('');
  return '<h2>Part 1: Claims and quick check</h2><p class="meta">About 8 minutes, 10 points</p>'+
  '<div class="sec" style="margin-top:0"><h3>Spot the red flags</h3><p>Imagine these posts show up in your feed. Decide which you’d trust and which are red flags. (6 points)</p>'+posts+'</div>'+
  '<div class="sec"><h3>Quick check</h3><p>Pick the best answer for each. (4 points)</p>'+qs+'</div>'+navBtns(1);
}

function part2(){
  var s=cartStats();
  var aisles=AISLES.map(function(a){
    var rows=ITEMS.filter(function(i){return i.aisle===a.id}).map(function(i){
      var inn=state.cart.indexOf(i.id)>-1;
      return '<div class="item'+(inn?' in':'')+'"><span><span class="nm">'+i.name+'</span><span class="sub">'+i.desc+'</span></span><span class="price">'+fmt(i.price)+'</span>'+
      '<button class="btn small'+(inn?' on':'')+'" data-k="it-'+i.id+'" data-act="cart" data-id="'+i.id+'" aria-label="'+(inn?'Remove ':'Add ')+i.name+(inn?' from cart':' to cart')+'">'+(inn?'Remove':'Add')+'</button></div>';
    }).join('');
    return '<div class="aisle"><h3>'+a.name+'</h3>'+rows+'</div>';
  }).join('');
  var over=s.total>BUDGET;
  var pct=Math.min(100,Math.round(s.total/BUDGET*100));
  var note=over?'Over budget by '+fmt(s.total-BUDGET)+'. Remove something.':(s.items.length<6?'Jordan needs at least 6 items for the week. Left to spend: '+fmt(BUDGET-s.total):'Left to spend: '+fmt(BUDGET-s.total));
  var sorted=AISLES.reduce(function(acc,a){return acc.concat(s.items.filter(function(i){return i.aisle===a.id}))},[]);
  var receipt='<div class="receipt"><h3>Jordan’s grocery receipt</h3><div class="rule"></div>'+
    (sorted.length?sorted.map(function(i){return '<div class="rl"><span>'+i.name+'</span><span>'+fmt(i.price)+'</span></div>'}).join(''):'<p class="empty">Nothing in the cart yet.</p>')+
    '<div class="rule"></div><div class="rl total"><span>Total</span><span>'+fmt(s.total)+'</span></div><div class="rl"><span>Budget</span><span>'+fmt(BUDGET)+'</span></div></div>';
  return '<h2>Part 2: Jordan’s grocery cart</h2><p class="meta">About 6 minutes, 10 points</p>'+
  '<p>Jordan has <strong>$25</strong> for a week of food. Build a cart that supports Jordan’s overall health and gut health without blowing the budget.</p>'+
  '<p>Your cart is scored on staying within budget (with at least 6 items), covering the food groups, including gut-friendly foods, and avoiding hype products.</p>'+
  aisles+receipt+
  '<div class="cartbar'+(over?' over':'')+'" role="status" aria-live="polite"><div class="row"><span>'+s.items.length+(s.items.length===1?' item':' items')+'</span><span class="money">'+fmt(s.total)+' of '+fmt(BUDGET)+'</span></div><div class="meter" style="--w:'+pct+'%"><i></i></div><p class="note">'+note+'</p></div>'+
  navBtns(2);
}

function part3(){
  var h='<h2>Part 3: Jordan’s week</h2><p class="meta">About 6 minutes, 8 points</p>'+
  '<div class="card jordan"><p><strong>Meet Jordan.</strong> Jordan is 16, has about $25 a week for food, and follows a fitness influencer who posts every day. Jordan has been feeling anxious after scrolling and stressed about fitting in, and hasn’t told anyone.</p><p class="meta" style="margin-bottom:0">You’ll make four decisions. Choices are final once you make them, so read carefully.</p></div>';
  for(var i=0;i<DEC.length;i++){
    var d=DEC[i];
    if(i>0&&!state.dec[DEC[i-1].id])break;
    var chosen=state.dec[d.id];
    h+='<section class="decision" aria-labelledby="h-'+d.id+'"><h3 id="h-'+d.id+'">Decision '+(i+1)+' of '+DEC.length+'</h3>'+(d.scene||'')+'<p>'+d.prompt+'</p><div class="choices">'+
    shuf(d.options,'dec'+d.id).map(function(o){
      return '<button class="choice'+(chosen===o.id?' chosen':'')+'" data-k="dc-'+d.id+'-'+o.id+'" data-act="dec" data-d="'+d.id+'" data-o="'+o.id+'"'+(chosen?' disabled':'')+' aria-pressed="'+(chosen===o.id)+'">'+o.text+'</button>';
    }).join('')+'</div>';
    if(chosen){var o=d.options.filter(function(x){return x.id===chosen})[0];h+='<div class="story" role="status"><strong>What happens next</strong><p>'+o.after+'</p></div>'}
    h+='</section>';
  }
  if(partDone(3))h+='<p class="meta" style="margin-top:24px">That’s Jordan’s week. Next up: the writing.</p>';
  return h+navBtns(3);
}

function part4(){
  var wb=WB.filter(function(x){return x.key===state.wBkey})[0];
  var opts=WB.map(function(w){
    var sel=state.wBkey===w.key;
    return '<label class="opt'+(sel?' sel':'')+'"><input type="radio" name="wb" value="'+w.key+'" data-k="wb-'+w.key+'" data-act="wBkey"'+(sel?' checked':'')+'><span>'+w.title+'</span></label>';

  '<label class="f" for="taA">Your letter</label><textarea class="ta" id="taA" data-act="wA" data-k="taA" placeholder="Dear Jordan,">'+esc(state.wA)+'</textarea><p class="wc" id="wcA">'+wc(state.wA)+' words</p>'+
  '<div class="checks" role="group" aria-label="Self-check before you move on">'+
  '<label><input type="checkbox" data-act="chk" data-c="a"'+(state.checks.a?' checked':'')+'><span>I explained how social media may feed Jordan’s anxiety.</span></label>'+
  '<label><input type="checkbox" data-act="chk" data-c="b"'+(state.checks.b?' checked':'')+'><span>I explained how vulnerability and EQ could help.</span></label>'+
  '<label><input type="checkbox" data-act="chk" data-c="c"'+(state.checks.c?' checked':'')+'><span>I gave one specific action for this week.</span></label></div></div>'+
  '<div class="sec"><h3>Choose one topic (10 points)</h3><p>Pick the topic you can explain best, then write a developed paragraph of 5 to 7 sentences.</p>'+
  '<fieldset class="mc" style="margin-top:6px"><legend class="meta" style="margin:0">Your topic</legend>'+opts+'</fieldset>'+
  (wb?'<div class="card"><p style="margin-top:0">'+wb.prompt+'</p><label class="f" for="taB">Your response</label><textarea class="ta" id="taB" data-act="wB" data-k="taB" style="min-height:170px">'+esc(state.wB)+'</textarea><p class="wc" id="wcB">'+wc(state.wB)+' words</p></div>':'')+'</div>'+
  navBtns(4);
}

function done(){
  var a=scoreP1(),b=scoreP2(),c=scoreP3();
  var auto=a.total+b.total+c;
  return '<h2>Submitted. Nice work'+(state.name?', '+esc(state.name.split(' ')[0]):'')+'.</h2>'+
  '<p class="meta">Your answers are final. Here’s how the automatically scored parts came out.</p>'+
  '<div class="score"><div><span>Part 1: Claims and quick check</span><b>'+a.total+' / 10</b></div><div><span>Part 2: Jordan’s grocery cart</span><b>'+b.total+' / 10</b></div><div><span>Part 3: Jordan’s week</span><b>'+c+' / 8</b></div><div><span><strong>Parts 1 to 3 total</strong></span><b>'+auto+' / 28</b></div><div><span>Part 4: Writing (scored by your teacher)</span><b>? / 22</b></div></div>'+
  '<div class="card"><h3>Hand in your work</h3><p>Save your responses and turn them in the way your teacher asked. Your teacher needs this file to score Part 4.</p>'+
  '<div class="actions"><button class="btn" data-act="pdf">Save as PDF</button><button class="btn ghost" data-act="dl">Save as text file</button><button class="btn ghost" data-act="copy">Copy my responses</button></div>'+
  '<p class="msg" id="doneMsg" role="status" aria-live="polite"></p>'+
  '<details id="repdet"><summary>Preview what gets handed in</summary><pre class="report" id="rep">'+esc(report())+'</pre></details></div>';
}

function navBtns(n){
  var h='<div class="nav"><span>'+(n>1?'<button class="btn ghost" data-act="back">Back</button>':'')+'</span>';
  if(n<4)h+='<button class="btn" data-act="next">Next part</button>';
  else h+='<button class="btn" data-act="askSubmit">Review and submit</button>';
  h+='</div>';
  if(n===4&&state.confirming){
    var m=missing();
    h+='<div class="confirm" role="alertdialog" aria-labelledby="cfh"><h3 id="cfh">Ready to submit?</h3>'+
    (m.length?'<p>You haven’t finished:</p><ul>'+m.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>':'<p>Everything is filled in.</p>')+
    '<p>You won’t be able to change your answers after you submit.</p><div class="nav"><button class="btn ghost" data-act="cancelSubmit" data-k="keepWorking">Keep working</button><button class="btn danger" data-act="submit">Submit my summative</button></div></div>';
  }
  return h;
}

/* ---------- report ---------- */
function report(){
  var a=scoreP1(),b=scoreP2(),c=scoreP3(),s=b.stats,L=[];
  var secs=state.startTs?Math.max(0,Math.round(((state.submittedTs||Date.now())-state.startTs)/1000)):0;
  L.push('UNIT SUMMATIVE: MIND, MEDIA & NUTRITION');
  L.push('Name: '+state.name);
  L.push('Period: '+state.period);
  L.push('Submitted: '+(state.submittedTs?new Date(state.submittedTs).toLocaleString():'not yet'));
  L.push('Time used: '+Math.floor(secs/60)+' min '+(secs%60)+' sec');
  L.push('');
  L.push('AUTO-SCORED: '+(a.total+b.total+c)+' / 28');
  L.push('');
  L.push('PART 1: '+a.total+' / 10');
  CLAIMS.forEach(function(x){var v=state.claims[x.id];L.push('  '+x.handle+': student said '+(v==='ok'?'Trustworthy':v==='flag'?'Red flag':'(no answer)')+' | correct: '+(x.answer==='ok'?'Trustworthy':'Red flag')+' | '+(v===x.answer?'+1':'0'))});
  MC.forEach(function(q,i){var o=q.opts.filter(function(x){return x.id===state.mc[q.id]})[0];L.push('  Quick check '+(i+1)+': '+(o?o.t:'(no answer)')+' | '+(state.mc[q.id]===q.correct?'+1':'0'))});
  L.push('');
  L.push('PART 2: '+b.total+' / 10');
  L.push('  Budget (6+ items, $25 or less): '+b.budget+' / 3');
  L.push('  Food groups covered ('+s.groups+' of 4): '+b.groups+' / 3');
  L.push('  Gut-friendly items ('+s.gut+'): '+b.gut+' / 2');
  L.push('  Hype items in cart ('+s.hype+'): '+b.hype+' / 2');
  L.push('  Cart ('+fmt(s.total)+'): '+(s.items.map(function(i){return i.name+' '+fmt(i.price)}).join('; ')||'(empty)'));
  L.push('');
  L.push('PART 3: '+c+' / 8');
  DEC.forEach(function(d,i){var o=d.options.filter(function(x){return x.id===state.dec[d.id]})[0];L.push('  Decision '+(i+1)+': '+(o?o.text+' | +'+o.pts:'(no choice)'))});
  L.push('');
  L.push('PART 4: scored by teacher (22 points)');
  L.push('');
  L.push('Letter to Jordan (12 points) - student self-check: social media '+(state.checks.a?'yes':'no')+', vulnerability/EQ '+(state.checks.b?'yes':'no')+', action '+(state.checks.c?'yes':'no'));
  L.push(state.wA.trim()||'(blank)');
  L.push('');
  var wb=WB.filter(function(x){return x.key===state.wBkey})[0];
  L.push('Chosen topic (10 points): '+(wb?wb.title:'(none chosen)'));
  L.push(state.wB.trim()||'(blank)');
  return L.join('\n');
}

/* ---------- render ---------- */
function render(){
  var k=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.k:null;
  renderHeader();
  var views=[intro,part1,part2,part3,part4,done];
  var m=$('#main');
  m.innerHTML=views[state.part]()+footer();
  if(k){var el=m.querySelector('[data-k="'+k+'"]');if(el)el.focus({preventScroll:true})}
}
function footer(){
  return '<div class="foot"><button class="linkbtn" data-act="clear" id="clearBtn">'+(state.part===5?'New student on this device':'Clear my answers on this device')+'</button></div>';
}
function go(n){state.part=n;state.confirming=false;save();render();window.scrollTo(0,0);$('#main').focus({preventScroll:true})}
function say(t){var el=$('#doneMsg');if(el)el.textContent=t}

var armed=false,armT;

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b||b.tagName==='TEXTAREA'||b.tagName==='INPUT')return;
  var a=b.dataset.act;
  if(a==='claim'){state.claims[b.dataset.id]=b.dataset.v;save();render()}
  else if(a==='cart'){var i=state.cart.indexOf(b.dataset.id);if(i>-1)state.cart.splice(i,1);else state.cart.push(b.dataset.id);save();render()}
  else if(a==='dec'){if(!state.dec[b.dataset.d]){state.dec[b.dataset.d]=b.dataset.o;save();render()}}
  else if(a==='goto'){go(+b.dataset.n)}
  else if(a==='next'){go(state.part+1)}
  else if(a==='back'){go(state.part-1)}
  else if(a==='start'){
    if(!state.name.trim()){$('#nmErr').hidden=false;$('#nm').focus();return}
    state.startTs=Date.now();go(1);
  }
  else if(a==='askSubmit'){state.confirming=true;save();render();var c=document.querySelector('.confirm');if(c)c.scrollIntoView({block:'center'})}
  else if(a==='cancelSubmit'){state.confirming=false;save();render()}
  else if(a==='submit'){state.submitted=true;state.submittedTs=Date.now();state.confirming=false;state.part=5;save();render();window.scrollTo(0,0)}
  else if(a==='timer'){state.hideTimer=!state.hideTimer;save();tickTimer()}
  else if(a==='pdf'){savePdf()}
  else if(a==='dl'){download()}
  else if(a==='copy'){copyIt()}
  else if(a==='clear'){
    if(!armed){armed=true;b.textContent='Click again to erase everything on this device';clearTimeout(armT);armT=setTimeout(function(){armed=false;render()},4000)}
    else{armed=false;try{localStorage.removeItem(KEY)}catch(x){}state=fresh();render();window.scrollTo(0,0)}
  }
});
document.addEventListener('input',function(e){
  var t=e.target,a=t.dataset&&t.dataset.act;
  if(a==='wA'){state.wA=t.value;$('#wcA').textContent=wc(t.value)+' words';save()}
  else if(a==='wB'){state.wB=t.value;$('#wcB').textContent=wc(t.value)+' words';save()}
  else if(a==='nm'){state.name=t.value;var er=$('#nmErr');if(er&&t.value.trim())er.hidden=true;save()}
  else if(a==='pd'){state.period=t.value;save()}
});
document.addEventListener('change',function(e){
  var t=e.target,a=t.dataset&&t.dataset.act;
  if(a==='mc'){state.mc[t.dataset.q]=t.value;save();render()}
  else if(a==='chk'){state.checks[t.dataset.c]=t.checked;save()}
  else if(a==='wBkey'){state.wBkey=t.value;save();render()}
});

function copyIt(){
  var t=report();
  var fallback=function(){var d=$('#repdet');d.open=true;var r=document.createRange();r.selectNodeContents($('#rep'));var s=window.getSelection();s.removeAllRanges();s.addRange(r);say('Your browser blocked copying. The text is selected below. Press Ctrl+C (or Cmd+C) to copy it.')};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){say('Copied. Paste it where your teacher asked.')},fallback)}
    else fallback();
  }catch(x){fallback()}
}
async function download(){
  try{
    var d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(!d){say('Saving files isn’t available here. Use “Copy my responses” instead.');return}
    var fn=((state.name||'student').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')||'student')+'_unit_summative.txt';
    await d.save({filename:fn,data:report()});
    say('Saved. Turn the file in the way your teacher asked.');
  }catch(x){
    if(x&&x.code==='declined')say('Save cancelled. You can try again.');
    else say('Couldn’t save the file here. Use “Copy my responses” instead.');
  }
}

function pdfSafe(s){return String(s).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g,'?')}
async function savePdf(){
  try{
    var J=window.jspdf&&window.jspdf.jsPDF;
    if(!J){say('The PDF tool didn’t load. Use “Save as text file” instead.');return}
    var d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(!d){say('Saving files isn’t available here. Use “Copy my responses” instead.');return}
    var doc=new J({unit:'pt',format:'letter'});
    var W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=54,maxW=W-2*M,y=M;
    function put(t,size,style,gap){
      doc.setFont('helvetica',style||'normal');doc.setFontSize(size);
      var lines=doc.splitTextToSize(pdfSafe(t),maxW),lh=size*1.4;
      lines.forEach(function(l){if(y+lh>H-M){doc.addPage();y=M}doc.text(l,M,y);y+=lh});
      y+=gap||0;
    }
    report().split('\n').forEach(function(line,i){
      if(i===0){put(line,17,'bold',6)}
      else if(/^(AUTO-SCORED|PART \d)/.test(line)){y+=4;put(line,12,'bold',2)}
      else if(/^(Letter to Jordan|Chosen topic)/.test(line)){y+=2;put(line,11,'bold',2)}
      else if(line.trim()===''){y+=5}
      else{put(line,10.5,'normal',1)}
    });
    var n=doc.getNumberOfPages();
    for(var p=1;p<=n;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(pdfSafe((state.name||'Student')+' - page '+p+' of '+n),M,H-28)}
    var fn=((state.name||'student').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')||'student')+'_unit_summative.pdf';
    await d.save({filename:fn,data:doc.output('arraybuffer')});
    say('Saved. Turn the PDF in the way your teacher asked.');
  }catch(x){
    if(x&&x.code==='declined')say('Save cancelled. You can try again.');
    else say('Couldn’t make the PDF here. Use “Save as text file” or “Copy my responses” instead.');
  }
}
